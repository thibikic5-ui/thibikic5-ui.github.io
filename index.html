<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta name="theme-color" content="#fff9f6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <title>マイ思い出マップ</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />

  <style>
    :root {
      --bg: #fffaf7;
      --card: #ffffff;
      --text: #514945;
      --sub: #a39a95;
      --line: #eee4df;
      --accent: #d4937a;
      --accent-light: #f9eee9;
      --green: #829b89;
      --shadow: 0 7px 24px rgba(80, 60, 50, 0.055);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Hiragino Sans",
        "Yu Gothic",
        "Meiryo",
        sans-serif;
    }

    body {
      padding-bottom: calc(82px + env(safe-area-inset-bottom));
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    /* =====================================
       APP
    ===================================== */

    .app {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    /* =====================================
       HEADER
    ===================================== */

    .header {
      position: sticky;
      top: 0;
      z-index: 1000;

      background: rgba(255, 250, 247, 0.94);
      backdrop-filter: blur(16px);

      border-bottom: 1px solid rgba(238, 228, 223, 0.8);
    }

    .header-inner {
      max-width: 760px;
      margin: 0 auto;

      padding:
        15px
        18px
        13px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .app-title {
      margin: 0;

      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.035em;
    }

    .header-subtitle {
      margin-top: 3px;

      font-size: 10px;
      color: var(--sub);

      letter-spacing: 0.08em;
    }

    .header-icon {
      width: 40px;
      height: 40px;

      border: 1px solid var(--line);
      border-radius: 50%;

      background: #fff;

      color: #796f69;
      font-size: 17px;

      box-shadow: 0 4px 14px rgba(70, 50, 40, 0.06);
    }

    /* =====================================
       SCREEN
    ===================================== */

    .screen {
      display: none;
      padding: 17px;
    }

    .screen.active {
      display: block;
    }

    .page-title {
      margin: 4px 0 17px;

      font-size: 24px;
      font-weight: 700;

      letter-spacing: 0.01em;
    }

    /* =====================================
       SEARCH
    ===================================== */

    .search-box {
      display: flex;
      gap: 8px;

      margin-bottom: 12px;
    }

    .search-input {
      flex: 1;
      min-width: 0;

      height: 45px;

      padding: 0 15px;

      border: 1px solid var(--line);
      border-radius: 15px;

      background: #fff;

      color: var(--text);
      outline: none;

      box-shadow: 0 3px 13px rgba(80, 60, 50, 0.025);
    }

    .search-input:focus {
      border-color: #dcbcae;
    }

    .filter-button {
      width: 45px;
      height: 45px;

      border: 1px solid var(--line);
      border-radius: 15px;

      background: #fff;
      color: #81766f;
    }

    .filters {
      display: none;

      padding: 13px;
      margin-bottom: 13px;

      border: 1px solid var(--line);
      border-radius: 16px;

      background: #fff;
    }

    .filters.open {
      display: block;
    }

    .filter-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    /* =====================================
       MEMORY CARD
    ===================================== */

    .memory-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .memory-card {
      overflow: hidden;

      border: 1px solid var(--line);
      border-radius: 20px;

      background: var(--card);

      box-shadow: var(--shadow);
    }

    .memory-card-main {
      padding: 15px;
    }

    .memory-card-top {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .memory-card-date {
      flex: 0 0 auto;

      width: 76px;
      min-width: 76px;

      padding: 6px 7px;

      border-radius: 9px;

      background: var(--accent-light);
      color: #a27362;

      font-size: 10px;
      line-height: 1.4;

      text-align: center;

      overflow-wrap: anywhere;
    }

    .memory-place-wrap {
      flex: 1;
      min-width: 0;
    }

    .memory-place {
      margin: 0;

      font-size: 17px;
      font-weight: 700;
      line-height: 1.4;

      word-break: break-word;
    }

    .memory-genre {
      margin-top: 2px;

      font-size: 10px;
      color: var(--sub);
    }

    .rating {
      margin-top: 8px;

      color: #d39478;

      letter-spacing: 0.02em;
    }

    .rating-number {
      margin-left: 5px;

      color: #9b908a;
      font-size: 11px;
      letter-spacing: 0;
    }

    .memory-comment {
      margin-top: 11px;

      font-size: 13px;
      line-height: 1.75;

      color: #746b66;

      white-space: pre-wrap;
      word-break: break-word;
    }

    .memory-meta {
      display: flex;
      flex-wrap: wrap;

      gap: 5px;

      margin-top: 11px;
    }

    .meta-chip {
      padding: 5px 8px;

      border-radius: 999px;

      background: #f8f5f3;

      color: #918680;

      font-size: 10px;
    }

    .memory-card-photo {
      display: block;

      width: 100%;
      height: 185px;

      object-fit: cover;

      background: #f2ece9;
    }

    .card-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);

      border-top: 1px solid #f0e7e3;
    }

    .card-action {
      height: 43px;

      border: none;

      background: #fff;

      color: #81766f;

      font-size: 11px;
    }

    .card-action + .card-action {
      border-left: 1px solid #f0e7e3;
    }

    /* =====================================
       EMPTY
    ===================================== */

    .empty {
      padding: 55px 20px;

      text-align: center;
      color: var(--sub);
    }

    .empty-icon {
      margin-bottom: 12px;

      font-size: 34px;
      color: #d9a18c;
    }

    .empty-title {
      margin-bottom: 5px;

      color: #756b66;
      font-size: 14px;
      font-weight: 700;
    }

    .empty-text {
      font-size: 11px;
      line-height: 1.7;
    }

    /* =====================================
       FORM
    ===================================== */

    .form-card {
      padding: 17px;

      border: 1px solid var(--line);
      border-radius: 21px;

      background: #fff;

      box-shadow: var(--shadow);
    }

    .form-group {
      margin-bottom: 19px;
    }

    .form-label {
      display: block;

      margin-bottom: 7px;

      font-size: 11px;
      font-weight: 700;

      color: #766c66;

      letter-spacing: 0.04em;
    }

    .required {
      margin-left: 3px;
      color: #d4937a;
    }

    .input,
    .textarea,
    .select {
      width: 100%;

      border: 1px solid #e9ded9;
      border-radius: 12px;

      background: #fffdfb;

      color: var(--text);

      outline: none;
    }

    .input {
      height: 45px;
      padding: 0 12px;
    }

    .textarea {
      min-height: 105px;
      padding: 12px;

      resize: vertical;

      line-height: 1.7;
    }

    .select {
      height: 45px;
      padding: 0 11px;
    }

    .input:focus,
    .textarea:focus,
    .select:focus {
      border-color: #d8b9aa;
      background: #fff;
    }

    /* =====================================
       DATE
    ===================================== */

    .date-input {
      max-width: 185px;
    }

    /* =====================================
       STAR RATING
    ===================================== */

    .star-rating {
      display: flex;
      align-items: center;
      gap: 1px;

      padding: 3px 0;
    }

    .star-button {
      width: 31px;
      height: 36px;

      padding: 0;

      border: none;

      background: transparent;

      color: #ded3cd;

      font-size: 25px;
      line-height: 1;
    }

    .star-button.selected {
      color: #d4937a;
    }

    .rating-display {
      margin-left: 8px;

      color: #988d87;
      font-size: 12px;
      white-space: nowrap;
    }

    /* =====================================
       ADDRESS SEARCH
    ===================================== */

    .address-search {
      position: relative;
    }

    .address-input-row {
      display: flex;
      gap: 7px;
    }

    .address-input-row .input {
      min-width: 0;
      flex: 1;
    }

    .address-search-button {
      flex: 0 0 76px;

      height: 45px;

      border: none;
      border-radius: 12px;

      background: #879c8d;
      color: #fff;

      font-size: 11px;
      font-weight: 700;
    }

    .suggestions {
      position: absolute;

      left: 0;
      right: 0;
      top: 51px;

      z-index: 3000;

      display: none;

      overflow: hidden;

      border: 1px solid var(--line);
      border-radius: 14px;

      background: #fff;

      box-shadow:
        0 10px 30px rgba(70, 50, 40, 0.12);
    }

    .suggestions.show {
      display: block;
    }

    .suggestion-item {
      width: 100%;

      padding: 11px 13px;

      border: none;
      border-bottom: 1px solid #f1eae7;

      background: #fff;

      text-align: left;

      color: #5f5752;
      font-size: 11px;
      line-height: 1.5;
    }

    .suggestion-item:last-child {
      border-bottom: none;
    }

    .suggestion-item:active {
      background: #faf3ef;
    }

    .suggestion-title {
      font-weight: 700;
    }

    .suggestion-address {
      margin-top: 2px;

      color: #a19892;
      font-size: 9px;
    }

    .address-help {
      margin-top: 6px;

      color: #aaa19b;
      font-size: 9px;
      line-height: 1.6;
    }

    /* =====================================
       LOCATION
    ===================================== */

    .location-box {
      padding: 12px;

      border: 1px solid var(--line);
      border-radius: 14px;

      background: #fffaf8;
    }

    .location-status {
      margin-bottom: 9px;

      color: #a19892;
      font-size: 11px;
      line-height: 1.6;
    }

    .location-status.has-location {
      color: #748c78;
    }

    .location-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 7px;
    }

    .secondary-button {
      height: 42px;

      border: 1px solid #e3d7d1;
      border-radius: 11px;

      background: #fff;

      color: #776d67;

      font-size: 11px;
    }

    .secondary-button.danger {
      color: #b27a6c;
    }

    /* =====================================
       PHOTOS
    ===================================== */

    .photo-input {
      width: 100%;

      padding: 11px;

      border: 1px dashed #ddcec7;
      border-radius: 13px;

      background: #fffaf8;

      color: #81766f;
      font-size: 11px;
    }

    .photo-preview-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);

      gap: 7px;

      margin-top: 9px;
    }

    .photo-preview {
      position: relative;

      overflow: hidden;

      aspect-ratio: 1;

      border-radius: 11px;

      background: #f2ece9;
    }

    .photo-preview img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .photo-remove {
      position: absolute;

      top: 5px;
      right: 5px;

      width: 25px;
      height: 25px;

      border: none;
      border-radius: 50%;

      background: rgba(50, 40, 35, 0.7);

      color: #fff;
      font-size: 14px;
    }

    /* =====================================
       BUTTONS
    ===================================== */

    .primary-button {
      width: 100%;
      height: 49px;

      border: none;
      border-radius: 14px;

      background: var(--accent);
      color: #fff;

      font-size: 13px;
      font-weight: 700;

      box-shadow:
        0 7px 18px rgba(177, 115, 91, 0.18);
    }

    .cancel-button {
      width: 100%;
      height: 44px;

      margin-top: 8px;

      border: none;
      border-radius: 14px;

      background: #f6f0ed;

      color: #81766f;

      font-size: 12px;
    }

    /* =====================================
       DETAIL
    ===================================== */

    .detail-card {
      overflow: hidden;

      border: 1px solid var(--line);
      border-radius: 21px;

      background: #fff;

      box-shadow: var(--shadow);
    }

    .detail-body {
      padding: 18px;
    }

    .detail-place {
      margin: 0;

      font-size: 24px;
      line-height: 1.4;

      word-break: break-word;
    }

    .detail-date {
      margin-top: 6px;

      color: #a09791;
      font-size: 11px;
    }

    .detail-section {
      margin-top: 19px;
    }

    .detail-section-title {
      margin-bottom: 6px;

      color: #9a8e87;
      font-size: 10px;
      font-weight: 700;
    }

    .detail-comment {
      color: #675e59;

      font-size: 13px;
      line-height: 1.85;

      white-space: pre-wrap;
    }

    .detail-location {
      color: #817771;

      font-size: 11px;
      line-height: 1.7;
    }

    .detail-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 8px;

      margin-top: 19px;
    }

    .detail-photo-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);

      gap: 7px;
    }

    .detail-photo-grid img {
      width: 100%;

      aspect-ratio: 1;

      object-fit: cover;

      border-radius: 12px;

      background: #f1ece9;
    }

    /* =====================================
       MAP
    ===================================== */

    #map {
      width: 100%;
      height: calc(100vh - 165px);

      min-height: 450px;

      border-radius: 18px;

      overflow: hidden;

      box-shadow: var(--shadow);
    }

    .map-wrapper {
      position: relative;
    }

    .map-floating {
      position: absolute;

      top: 12px;
      right: 12px;

      z-index: 500;

      display: flex;
      flex-direction: column;

      gap: 7px;
    }

    .map-floating button {
      width: 43px;
      height: 43px;

      border: none;
      border-radius: 50%;

      background: rgba(255, 255, 255, 0.95);

      color: #665c56;

      font-size: 17px;

      box-shadow:
        0 4px 15px rgba(50, 40, 35, 0.15);
    }

    .custom-pin {
      position: relative;

      width: 34px;
      height: 34px;

      border-radius: 50% 50% 50% 0;

      transform: rotate(-45deg);

      background: #d4937a;

      border: 3px solid #fff;

      box-shadow:
        0 3px 10px rgba(60, 45, 40, 0.25);
    }

    .custom-pin::after {
      content: "";

      position: absolute;

      width: 10px;
      height: 10px;

      border-radius: 50%;

      background: #fff;

      top: 9px;
      left: 9px;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 14px;
    }

    .leaflet-popup-content {
      margin: 13px;

      font-size: 11px;
      line-height: 1.6;
    }

    /* =====================================
       SETTINGS
    ===================================== */

    .settings-list {
      display: flex;
      flex-direction: column;

      gap: 10px;
    }

    .settings-item {
      padding: 16px;

      border: 1px solid var(--line);
      border-radius: 17px;

      background: #fff;

      box-shadow: 0 3px 15px rgba(70, 50, 40, 0.025);
    }

    .settings-item-title {
      color: #5e5550;

      font-size: 13px;
      font-weight: 700;
    }

    .settings-item-text {
      margin-top: 5px;

      color: #9d928b;

      font-size: 10px;
      line-height: 1.7;
    }

    /* =====================================
       BOTTOM NAV
    ===================================== */

    .bottom-nav {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      z-index: 2000;

      padding:
        7px
        10px
        calc(7px + env(safe-area-inset-bottom));

      background: rgba(255, 255, 255, 0.95);

      backdrop-filter: blur(16px);

      border-top: 1px solid #eee5e0;
    }

    .bottom-nav-inner {
      max-width: 500px;

      margin: 0 auto;

      display: grid;
      grid-template-columns: repeat(3, 1fr);

      gap: 5px;
    }

    .nav-button {
      height: 53px;

      border: none;
      border-radius: 15px;

      background: transparent;

      color: #a09690;

      font-size: 9px;
    }

    .nav-icon {
      display: block;

      margin-bottom: 2px;

      font-size: 19px;
    }

    .nav-button.active {
      background: #f9efeb;

      color: #ad7763;

      font-weight: 700;
    }

    /* =====================================
       FAB
    ===================================== */

    .fab {
      position: fixed;

      right: 20px;

      /*
       * ナビゲーションと重ならない位置。
       * safe-areaにも対応。
       */

      bottom:
        calc(
          92px +
          env(safe-area-inset-bottom)
        );

      z-index: 1500;

      width: 55px;
      height: 55px;

      border: none;
      border-radius: 50%;

      background: var(--accent);

      color: #fff;

      font-size: 24px;

      box-shadow:
        0 9px 25px rgba(171, 109, 86, 0.25);
    }

    /* =====================================
       TOAST
    ===================================== */

    .toast {
      position: fixed;

      left: 50%;
      bottom: calc(
        90px +
        env(safe-area-inset-bottom)
      );

      z-index: 5000;

      transform:
        translate(-50%, 20px);

      min-width: 220px;
      max-width: calc(100vw - 40px);

      padding: 11px 15px;

      border-radius: 13px;

      background: rgba(55, 48, 44, 0.92);

      color: #fff;

      text-align: center;

      font-size: 11px;

      opacity: 0;

      pointer-events: none;

      transition: 0.25s;
    }

    .toast.show {
      opacity: 1;

      transform:
        translate(-50%, 0);
    }

    /* =====================================
       MOBILE
    ===================================== */

    @media (max-width: 430px) {
      .screen {
        padding: 14px;
      }

      .memory-card-date {
        width: 72px;
        min-width: 72px;
      }

      .star-button {
        width: 29px;
      }

      .rating-display {
        margin-left: 4px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header class="header">
    <div class="header-inner">

      <div>
        <h1 class="app-title">
          マイ思い出マップ
        </h1>

        <div class="header-subtitle">
          大切な場所を、そっと残す
        </div>
      </div>

      <button
        class="header-icon"
        onclick="openScreen('settings')"
      >
        ⚙️
      </button>

    </div>
  </header>


  <!-- ===================================
       HOME
  ==================================== -->

  <section
    id="screen-home"
    class="screen active"
  >

    <h2 class="page-title">
      思い出
    </h2>

    <div class="search-box">

      <input
        id="searchInput"
        class="search-input"
        type="search"
        placeholder="場所や思い出を検索"
        oninput="renderMemoryList()"
      />

      <button
        class="filter-button"
        onclick="toggleFilters()"
      >
        ☷
      </button>

    </div>

    <div
      id="filters"
      class="filters"
    >

      <div class="filter-row">

        <select
          id="genreFilter"
          class="select"
          onchange="renderMemoryList()"
        >
          <option value="">
            すべてのジャンル
          </option>

          <option value="食事">
            食事
          </option>

          <option value="カフェ">
            カフェ
          </option>

          <option value="旅行">
            旅行
          </option>

          <option value="買い物">
            買い物
          </option>

          <option value="デート">
            デート
          </option>

          <option value="観光">
            観光
          </option>

          <option value="その他">
            その他
          </option>
        </select>

        <select
          id="ratingFilter"
          class="select"
          onchange="renderMemoryList()"
        >
          <option value="">
            すべての評価
          </option>

          <option value="9">
            9以上
          </option>

          <option value="8">
            8以上
          </option>

          <option value="7">
            7以上
          </option>

          <option value="6">
            6以上
          </option>

          <option value="5">
            5以上
          </option>
        </select>

      </div>

    </div>

    <div
      id="memoryList"
      class="memory-list"
    ></div>

  </section>


  <!-- ===================================
       REGISTER / EDIT
  ==================================== -->

  <section
    id="screen-register"
    class="screen"
  >

    <h2
      id="formTitle"
      class="page-title"
    >
      思い出を登録
    </h2>

    <div class="form-card">

      <!-- PLACE -->

      <div class="form-group">

        <label class="form-label">
          場所名<span class="required">*</span>
        </label>

        <input
          id="placeInput"
          class="input"
          type="text"
          placeholder="例：軽井沢のカフェ"
        />

      </div>


      <!-- DATE -->

      <div class="form-group">

        <label class="form-label">
          日付<span class="required">*</span>
        </label>

        <input
          id="dateInput"
          class="input date-input"
          type="date"
        />

      </div>


      <!-- RATING -->

<script>
/* =========================================================
   DATABASE
========================================================= */

const DB_NAME = "myMemoryMapDB";
const DB_VERSION = 2;

const MEMORY_STORE = "memories";
const PHOTO_STORE = "photos";

let db = null;

let editingMemoryId = null;

let selectedRating = 5;

let existingPhotos = [];
let newPhotos = [];

let map = null;
let mapMarkers = [];

let suggestionTimer = null;


/* =========================================================
   UTILITY
========================================================= */

function generateId() {

  if (
    window.crypto &&
    crypto.randomUUID
  ) {
    return crypto.randomUUID();
  }

  return (
    Date.now().toString(36) +
    Math.random()
      .toString(36)
      .substring(2)
  );
}


function isValidCoordinate(value) {

  return (
    value !== null &&
    value !== undefined &&
    value !== "" &&
    Number.isFinite(
      Number(value)
    )
  );
}


function hasLocation(memory) {

  return (
    isValidCoordinate(
      memory.latitude
    ) &&
    isValidCoordinate(
      memory.longitude
    )
  );
}


function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll(
      "'",
      "&#039;"
    );
}


function formatDate(dateString) {

  if (!dateString) {
    return "";
  }

  const date =
    new Date(
      dateString + "T00:00:00"
    );

  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return dateString;
  }

  return (
    date.getFullYear() +
    "/" +
    String(
      date.getMonth() + 1
    ).padStart(2, "0") +
    "/" +
    String(
      date.getDate()
    ).padStart(2, "0")
  );
}


function formatStars(rating) {

  const value =
    Math.min(
      10,
      Math.max(
        0,
        Number(rating) || 0
      )
    );

  return (
    "★".repeat(value) +
    "☆".repeat(10 - value)
  );
}


function showToast(message) {

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent = message;

  toast.classList.add("show");

  clearTimeout(
    showToast.timer
  );

  showToast.timer =
    setTimeout(() => {
      toast.classList.remove(
        "show"
      );
    }, 2400);
}


/* =========================================================
   DATABASE OPEN
========================================================= */

function openDatabase() {

  return new Promise(
    (resolve, reject) => {

      const request =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );

      request.onupgradeneeded =
        event => {

          const database =
            event.target.result;

          if (
            !database.objectStoreNames
              .contains(
                MEMORY_STORE
              )
          ) {

            const store =
              database.createObjectStore(
                MEMORY_STORE,
                {
                  keyPath: "id"
                }
              );

            store.createIndex(
              "date",
              "date",
              {
                unique: false
              }
            );
          }

          if (
            !database.objectStoreNames
              .contains(
                PHOTO_STORE
              )
          ) {

            const store =
              database.createObjectStore(
                PHOTO_STORE,
                {
                  keyPath: "id"
                }
              );

            store.createIndex(
              "memoryId",
              "memoryId",
              {
                unique: false
              }
            );
          }
        };


      request.onsuccess = () => {

        db = request.result;

        db.onversionchange =
          () => {
            db.close();
          };

        resolve(db);
      };


      request.onerror = () => {
        reject(
          request.error
        );
      };

    }
  );
}


/* =========================================================
   MEMORY DB
========================================================= */

function getAllMemories() {

  return new Promise(
    (resolve, reject) => {

      const tx =
        db.transaction(
          MEMORY_STORE,
          "readonly"
        );

      const request =
        tx
          .objectStore(
            MEMORY_STORE
          )
          .getAll();

      request.onsuccess =
        () => {
          resolve(
            request.result || []
          );
        };

      request.onerror =
        () => {
          reject(
            request.error
          );
        };
    }
  );
}


function getMemory(id) {

  return new Promise(
    (resolve, reject) => {

      const tx =
        db.transaction(
          MEMORY_STORE,
          "readonly"
        );

      const request =
        tx
          .objectStore(
            MEMORY_STORE
          )
          .get(id);

      request.onsuccess =
        () => {
          resolve(
            request.result || null
          );
        };

      request.onerror =
        () => {
          reject(
            request.error
          );
        };
    }
  );
}


function putMemory(memory) {

  return new Promise(
    (resolve, reject) => {

      const tx =
        db.transaction(
          MEMORY_STORE,
          "readwrite"
        );

      tx
        .objectStore(
          MEMORY_STORE
        )
        .put(memory);

      tx.oncomplete =
        () => resolve();

      tx.onerror =
        () => {
          reject(
            tx.error
          );
        };
    }
  );
}


function deleteMemoryRecord(id) {

  return new Promise(
    (resolve, reject) => {

      const tx =
        db.transaction(
          [
            MEMORY_STORE,
            PHOTO_STORE
          ],
          "readwrite"
        );

      tx
        .objectStore(
          MEMORY_STORE
        )
        .delete(id);

      const photoStore =
        tx.objectStore(
          PHOTO_STORE
        );

      const index =
        photoStore.index(
          "memoryId"
        );

      const request =
        index.getAllKeys(id);

      request.onsuccess =
        () => {

          request.result.forEach(
            photoId => {
              photoStore.delete(
                photoId
              );
            }
          );
        };

      tx.oncomplete =
        () => resolve();

      tx.onerror =
        () => {
          reject(
            tx.error
          );
        };
    }
  );
}


/* =========================================================
   PHOTO DB
========================================================= */

function getPhotosForMemory(
  memoryId
) {

  return new Promise(
    (resolve, reject) => {

      const tx =
        db.transaction(
          PHOTO_STORE,
          "readonly"
        );

      const index =
        tx
          .objectStore(
            PHOTO_STORE
          )
          .index(
            "memoryId"
          );

      const request =
        index.getAll(
          memoryId
        );

      request.onsuccess =
        () => {
          resolve(
            request.result || []
          );
        };

      request.onerror =
        () => {
          reject(
            request.error
          );
        };
    }
  );
}


function putPhoto(photo) {

  return new Promise(
    (resolve, reject) => {

      const tx =
        db.transaction(
          PHOTO_STORE,
          "readwrite"
        );

      tx
        .objectStore(
          PHOTO_STORE
        )
        .put(photo);

      tx.oncomplete =

      tx.onerror =

          reject(
            tx.error
          );
        };
    }
  );
}


function deletePhoto(id) {

  return new Promise(
    (resolve, reject) => {

      const tx =
        db.transaction(

        );

      tx
        .objectStore(

/* =========================================================
   MIGRATION
========================================================= */

async function migrateLocalStorage() {

  const migrationKey =
    "myMemoryMap_localStorage_migration_v3";

  if (
    localStorage.getItem(
      migrationKey
    )
  ) {
    return;
  }

  let oldData = null;

  try {

    const raw =
      localStorage.getItem(
        "memories"
      );

    if (raw) {
      oldData =
        JSON.parse(raw);
    }

  } catch (error) {

    console.warn(
      "旧データ読み込み失敗",
      error
    );
  }

  if (
    !Array.isArray(oldData)
  ) {

    localStorage.setItem(
      migrationKey,
      "done"
    );

    return;
  }


  const current =
    await getAllMemories();

  const ids =
    new Set(
      current.map(
        memory =>
          String(memory.id)
      )
    );


  for (
    const oldMemory
    of oldData
  ) {

    if (
      !oldMemory ||
      typeof oldMemory !==
        "object"
    ) {
      continue;
    }

    let id =
      oldMemory.id
        ? String(
            oldMemory.id
          )
        : generateId();


    if (ids.has(id)) {
      continue;
    }

    ids.add(id);


    /*
     * 位置情報は、
     * 元データに本当にある場合だけ保存。
     *
     * 現在地などは一切取得しない。
     */

    let latitude = null;
    let longitude = null;

    if (
      isValidCoordinate(
        oldMemory.latitude
      ) &&
      isValidCoordinate(
        oldMemory.longitude
      )
    ) {

      latitude =
        Number(
          oldMemory.latitude
        );

      longitude =
        Number(
          oldMemory.longitude
        );
    }


    const memory = {

      id,

      place:
        oldMemory.place ||
        oldMemory.placeName ||
        "",

      rating:
        Math.min(
          10,
          Math.max(
            1,
            Number(
              oldMemory.rating
            ) || 5
          )
        ),

      date:
        oldMemory.date ||
        new Date()
          .toISOString()
          .slice(0, 10),

      genre:
        oldMemory.genre || "",

      price:
        Number(
          oldMemory.price
        ) || 0,

      address:
        oldMemory.address || "",

      comment:
        oldMemory.comment || "",

      latitude,
      longitude,

      createdAt:
        oldMemory.createdAt ||
        Date.now(),

      updatedAt:
        Date.now()
    };


    await putMemory(
      memory
    );
  }


  localStorage.setItem(
    migrationKey,
    "done"
  );
}

  }
}


/* =========================================================
   STAR RATING
========================================================= */

function buildStarRating() {

  const container =
    document.getElementById(
      "starRating"
    );

  container.innerHTML = "";


  for (
    let i = 1;
    i <= 10;
    i++
  ) {

    const button =
      document.createElement(
        "button"
      );

    button.type =
      "button";

    button.className =
      "star-button";

    button.textContent =
      "★";

    button.onclick =
      () => {
        setRating(i);
      };

    container.appendChild(
      button
    );
  }

  updateStars();
}


function setRating(value) {

  selectedRating =
    Math.min(
      10,
      Math.max(
        1,
        Number(value) || 5
      )
    );

  document.getElementById(
    "ratingInput"
  ).value =
    selectedRating;

  updateStars();
}


function updateStars() {

  document
    .querySelectorAll(
      ".star-button"
    )
    .forEach(
      (button, index) => {

        button.classList.toggle(
          "selected",
          index + 1 <=
            selectedRating
        );
      }
    );


  const container =
    document.getElementById(
      "starRating"
    );

  let display =
    container.querySelector(
      ".rating-display"
    );

  if (!display) {

    display =
      document.createElement(
        "span"
      );

    display.className =
      "rating-display";

    container.appendChild(
      display
    );
  }

  display.textContent =
    `${selectedRating} / 10`;
}

/* =========================================================

========================================================= */

async function openEditMemory(
  id
) {

  try {

    const memory =
      await getMemory(id);


    if (!memory) {

      showToast(
        "この思い出のデータが見つかりません"
      );

      return;
    }


    editingMemoryId =
      String(memory.id);


    document.getElementById(
      "formTitle"
    ).textContent =
      "思い出を編集";


    document.getElementById(
      "placeInput"
    ).value =
      memory.place || "";


    document.getElementById(
      "dateInput"
    ).value =
      memory.date || "";


    document.getElementById(
      "genreInput"
    ).value =
      memory.genre || "";


    document.getElementById(
      "priceInput"
    ).value =
      memory.price || "";


    document.getElementById(
      "addressInput"
    ).value =
      memory.address || "";


    document.getElementById(
      "commentInput"
    ).value =
      memory.comment || "";


    /*
     * 編集時にGPSを取得しない。
     */

    if (
      hasLocation(memory)
    ) {

      document.getElementById(
        "latitudeInput"
      ).value =
        memory.latitude;

      document.getElementById(
        "longitudeInput"
      ).value =
        memory.longitude;

    } else {

      document.getElementById(
        "latitudeInput"
      ).value = "";

      document.getElementById(
        "longitudeInput"
      ).value = "";
    }


    setRating(
      Number(
        memory.rating
      ) || 5
    );


    existingPhotos =
      await getPhotosForMemory(
        memory.id
      );

    newPhotos = [];


    document.getElementById(
      "photoInput"
    ).value = "";


    updateLocationStatus();

    renderPhotoPreview();


    openScreen(
      "register"
    );

  } catch (error) {

    console.error(
      error
    );

    showToast(
      "編集データの読み込みに失敗しました"
    );
  }

/* =========================================================
   SAVE
========================================================= */

async function saveMemory() {

  const place =
    document.getElementById(
      "placeInput"
    ).value.trim();


  const date =
    document.getElementById(
      "dateInput"
    ).value;


  if (!place) {

    showToast(
      "場所名を入力してください"
    );

    return;
  }


  if (!date) {

    showToast(
      "日付を入力してください"
    );

    return;
  }


  /*
   * 空欄なら必ずnull。
   * 勝手に現在地を取得しない。
   */

  const latitudeRaw =
    document.getElementById(
      "latitudeInput"
    ).value;

  const longitudeRaw =
    document.getElementById(
      "longitudeInput"
    ).value;


  let latitude = null;
  let longitude = null;


  if (
    isValidCoordinate(
      latitudeRaw
    ) &&
    isValidCoordinate(
      longitudeRaw
    )
  ) {

    latitude =
      Number(latitudeRaw);

    longitude =
      Number(longitudeRaw);
  }


  let oldMemory = null;


  if (editingMemoryId) {

    oldMemory =
      await getMemory(
        editingMemoryId
      );

    if (!oldMemory) {

      showToast(
        "編集対象のデータが見つかりません"
      );

      return;
    }
  }


  const memory = {

    id:
      editingMemoryId ||
      generateId(),

    place,

    rating:
      Number(
        document.getElementById(
          "ratingInput"
        ).value
      ) || 5,

    date,

    genre:
      document.getElementById(
        "genreInput"
      ).value,

    price:
      Number(
        document.getElementById(
          "priceInput"
        ).value
      ) || 0,

    address:
      document.getElementById(
        "addressInput"
      ).value.trim(),

    comment:
      document.getElementById(
        "commentInput"
      ).value.trim(),

    latitude,
    longitude,

    createdAt:
      oldMemory?.createdAt ||
      Date.now(),

    updatedAt:
      Date.now()
  };


  try {

    await putMemory(
      memory
    );


    /*
     * 新しい写真
     */

    for (
      const photo
      of newPhotos
    ) {

      await putPhoto({

        id:
          generateId(),

        memoryId:
          memory.id,

        name:
          photo.name,

        type:
          photo.type,

        blob:
          photo.blob,

        createdAt:
          Date.now()
      });
    }


    /*
     * 削除された写真
     */

    if (editingMemoryId) {

      const oldPhotos =
        await getPhotosForMemory(
          memory.id
        );

      const currentIds =
        new Set(
          existingPhotos.map(
            photo =>
              photo.id
          )
        );


      for (
        const photo
        of oldPhotos
      ) {

        if (
          !currentIds.has(
            photo.id
          )
        ) {

          await deletePhoto(
            photo.id
          );
        }
      }
    }


    showToast(
      editingMemoryId
        ? "思い出を更新しました"
        : "思い出を保存しました"
    );


    resetForm();

    openScreen(
      "home"
    );

  } catch (error) {

    console.error(
      error
    );

    showToast(
      "保存に失敗しました"
    );
  }
}


/* =========================================================
   LOCATION
========================================================= */

function updateLocationStatus() {

  const latitude =
    document.getElementById(
      "latitudeInput"
    ).value;

  const longitude =
    document.getElementById(
      "longitudeInput"
    ).value;


  const status =
    document.getElementById(
      "locationStatus"
    );


  if (
    isValidCoordinate(
      latitude
    ) &&
    isValidCoordinate(
      longitude
    )
  ) {

    status.classList.add(
      "has-location"
    );

    status.innerHTML =
      "📍 位置情報あり<br>" +
      "緯度: " +
      Number(
        latitude
      ).toFixed(6) +
      "<br>" +
      "経度: " +
      Number(
        longitude
      ).toFixed(6);

  } else {

    status.classList.remove(
      "has-location"
    );

    status.textContent =
      "位置情報は登録されていません";
  }
}


function getCurrentLocation() {

  if (
    !navigator.geolocation
  ) {

    showToast(
      "このブラウザでは位置情報を取得できません"
    );

    return;
  }


  showToast(
    "現在地を取得しています..."
  );


  navigator.geolocation.getCurrentPosition(

    position => {

      document.getElementById(
        "latitudeInput"
      ).value =
        position.coords.latitude;

      document.getElementById(
        "longitudeInput"
      ).value =
        position.coords.longitude;


      updateLocationStatus();


      showToast(
        "現在地を登録しました"
      );
    },


    error => {

      console.error(
        error
      );

      showToast(
        "位置情報を取得できませんでした"
      );
    },


    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }
  );
}


function clearLocation() {

  document.getElementById(
    "latitudeInput"
  ).value = "";

  document.getElementById(
    "longitudeInput"
  ).value = "";


  updateLocationStatus();


  showToast(
    "位置情報を削除しました"
  );
}


/* =========================================================
   ADDRESS SUGGESTION
========================================================= */

function handleAddressInput() {

  const value =
    document.getElementById(
      "addressInput"
    ).value.trim();


  clearTimeout(
    suggestionTimer
  );


  if (
    value.length < 2
  ) {

    hideSuggestions();

    return;
  }


  suggestionTimer =
    setTimeout(
      () => {
        fetchSuggestions(
          value
        );
      },
      500
    );
}


async function fetchSuggestions(
  query
) {

  try {

    const url =
      "https://nominatim.openstreetmap.org/search?" +
      new URLSearchParams({

        q: query,

        format: "json",

        limit: "5",

        "accept-language":
          "ja"
      });


    const response =
      await fetch(
        url
      );


    if (
      !response.ok
    ) {
      return;
    }


    const results =
      await response.json();


    renderSuggestions(
      results
    );

  } catch (error) {

    console.warn(
      "候補取得失敗",
      error
    );
  }
}


function renderSuggestions(
  results
) {

  const container =
    document.getElementById(
      "suggestions"
    );


  container.innerHTML = "";


  if (
    !results ||
    !results.length
  ) {

    hideSuggestions();

    return;
  }


  results.forEach(
    result => {

      const button =
        document.createElement(
          "button"
        );

      button.type =
        "button";

      button.className =
        "suggestion-item";


      const parts =
        String(
          result.display_name ||
          ""
        ).split(",");


      const title =
        parts.shift() ||
        result.display_name;


      const address =
        parts
          .slice(0, 4)
          .join(",");


      button.innerHTML = `

        <div class="suggestion-title">
          ${escapeHtml(
            title
          )}
        </div>

        <div class="suggestion-address">
          ${escapeHtml(
            address
          )}
        </div>

      `;


      button.onclick =
        () => {

          selectSuggestion(
            result
          );
        };


      container.appendChild(
        button
      );
    }
  );


  container.classList.add(
    "show"
  );
}


function selectSuggestion(
  result
) {

  document.getElementById(
    "addressInput"
  ).value =
    result.display_name ||
    "";


  document.getElementById(
    "latitudeInput"
  ).value =
    Number(
      result.lat
    );


  document.getElementById(
    "longitudeInput"
  ).value =
    Number(
      result.lon
    );


  updateLocationStatus();

  hideSuggestions();


  showToast(
    "場所を登録しました"
  );
}


function hideSuggestions() {

  document
    .getElementById(
      "suggestions"
    )
    .classList.remove(
      "show"
    );
}


async function searchAddress() {

  const query =
    document.getElementById(
      "addressInput"
    ).value.trim();


  if (!query) {

    showToast(
      "場所を入力してください"
    );

    return;
  }


  try {

    showToast(
      "場所を検索しています..."
    );


    const url =
      "https://nominatim.openstreetmap.org/search?" +
      new URLSearchParams({

        q: query,

        format: "json",

        limit: "1",

        "accept-language":
          "ja"
      });


    const response =
      await fetch(
        url
      );


    if (
      !response.ok
    ) {
      throw new Error(
        "検索失敗"
      );
    }


    const results =
      await response.json();


    if (
      !results.length
    ) {

      showToast(
        "場所が見つかりませんでした"
      );

      return;
    }


    selectSuggestion(
      results[0]
    );

  } catch (error) {

    console.error(
      error
    );

    showToast(
      "場所の検索に失敗しました"
    );
  }
}


/* =========================================================
   PHOTOS
========================================================= */

function handlePhotoSelect(
  event
) {

  const files =
    Array.from(
      event.target.files || []
    );


  for (
    const file
    of files
  ) {

    if (
      !file.type.startsWith(
        "image/"
      )
    ) {
      continue;
    }


    newPhotos.push({

      name:
        file.name,

      type:
        file.type,

      blob:
        file
    });
  }


  event.target.value = "";

  renderPhotoPreview();
}


function removeExistingPhoto(
  id
) {

  existingPhotos =
    existingPhotos.filter(
      photo =>
        photo.id !== id
    );

  renderPhotoPreview();
}


function removeNewPhoto(
  index
) {

  newPhotos.splice(
    index,
    1
  );

  renderPhotoPreview();
}


function renderPhotoPreview() {

  const container =
    document.getElementById(
      "photoPreviewGrid"
    );

  container.innerHTML = "";


  existingPhotos.forEach(
    photo => {

      const wrapper =
        document.createElement(
          "div"
        );

      wrapper.className =
        "photo-preview";


      const img =
        document.createElement(
          "img"
        );


      const url =
        URL.createObjectURL(
          photo.blob
        );


      img.src = url;


      img.onload =
        () => {
          URL.revokeObjectURL(
            url
          );
        };


      const button =
        document.createElement(
          "button"
        );

      button.type =
        "button";

      button.className =
        "photo-remove";

      button.textContent =
        "×";


      button.onclick =
        () => {

          removeExistingPhoto(
            photo.id
          );
        };


      wrapper.appendChild(
        img
      );

      wrapper.appendChild(
        button
      );

      container.appendChild(
        wrapper
      );
    }
  );


  newPhotos.forEach(
    (photo, index) => {

      const wrapper =
        document.createElement(
          "div"
        );

      wrapper.className =
        "photo-preview";


      const img =
        document.createElement(
          "img"
        );


      const url =
        URL.createObjectURL(
          photo.blob
        );


      img.src = url;


      img.onload =
        () => {
          URL.revokeObjectURL(
            url
          );
        };


      const button =
        document.createElement(
          "button"
        );

      button.type =
        "button";

      button.className =
        "photo-remove";

      button.textContent =
        "×";


      button.onclick =
        () => {

          removeNewPhoto(
            index
          );
        };


      wrapper.appendChild(
        img
      );

      wrapper.appendChild(
        button
      );

      container.appendChild(
        wrapper
      );
    }
  );
}

    document.getElementById(

    ).value

    document.getElementById(
      "genreFilter"
    ).value;


  const rating =
    document.getElementById(
      "ratingFilter"
    ).value;


  let filtered =
    memories.filter(
      memory => {

        const text =
          (
            (memory.place ||
              "") +
            " " +
            (memory.address ||
              "") +
            " " +
            (memory.comment ||
              "") +
            " " +
            (memory.genre ||
              "")
          ).toLowerCase();


        if (
          search &&
          !text.includes(
            search
          )
        ) {
          return false;
        }


        if (
          genre &&
          memory.genre !==
            genre
        ) {
          return false;

        if (
          rating &&
          Number(
            memory.rating

            Number(rating)

/* =========================================================
   MAP
========================================================= */

function initializeMap() {

  if (map) {
    return;
  }


  map =
    L.map(
      "map",
      {
        zoomControl: false
      }
    );


  /*
   * 前のOpenStreetMap版に戻す。
   */

  L.tileLayer(
    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,

      attribution:
        "&copy; OpenStreetMap contributors"
    }
  ).addTo(map);


  L.control
    .zoom({
      position:
        "bottomright"
    })
    .addTo(map);


  map.setView(
    [
      35.681236,
      139.767125
    ],
    5
  );
}


function createPinIcon() {

  return L.divIcon({

    className: "",

    html: `
      <div class="custom-pin"></div>
    `,

    iconSize: [
      34,
      34
    ],

    iconAnchor: [
      17,
      34
    ],

    popupAnchor: [
      0,
      -30
    ]
  });
}


async function renderMapMarkers() {

  if (!map) {
    return;
  }


  mapMarkers.forEach(
    marker => {
      map.removeLayer(
        marker
      );
    }
  );


  mapMarkers = [];


  const memories =
    await getAllMemories();


  const located =
    memories.filter(
      memory =>
        hasLocation(
          memory
        )
    );


  if (!located.length) {
    return;
  }


  const bounds = [];


  for (
    const memory
    of located
  ) {

    const lat =
      Number(
        memory.latitude
      );

    const lng =
      Number(
        memory.longitude
      );


    const marker =
      L.marker(
        [lat, lng],
        {
          icon:
            createPinIcon()
        }
      );


    marker.bindPopup(`

      <div>

        <strong>
          ${escapeHtml(
            memory.place
          )}
        </strong>

        <br>

        <span>
          ${formatStars(
            memory.rating
          )}
          ${
            Number(
              memory.rating
            ) || 0
          } / 10
        </span>

        <br><br>

        <button
          onclick="openDetail('${memory.id}')"
          style="
            border:none;
            border-radius:8px;
            padding:7px 10px;
            background:#d4937a;
            color:white;
          "
        >
          詳細を見る
        </button>

      </div>

    `);


    marker.addTo(
      map
    );


    mapMarkers.push(
      marker
    );


    bounds.push([
      lat,
      lng
    ]);
  }


  if (
    bounds.length === 1
  ) {

    map.setView(
      bounds[0],
      15
    );

  } else {

    map.fitBounds(
      bounds,
      {
        padding: [
          40,
          40
        ]
      }
    );
  }
}


async function fitAllMarkers() {

  await renderMapMarkers();
}


function moveToCurrentLocation() {

  if (
    !navigator.geolocation
  ) {

    showToast(
      "位置情報を利用できません"
    );

    return;
  }


  navigator.geolocation.getCurrentPosition(

    position => {

      if (!map) {
        return;
      }


      map.setView(
        [
          position.coords.latitude,
          position.coords.longitude
        ],
        16
      );


      L.circleMarker(
        [
          position.coords.latitude,
          position.coords.longitude
        ],
        {
          radius: 7,
          color: "#758d77",
          fillColor: "#758d77",
          fillOpacity: 0.8
        }
      )
        .addTo(map)
        .bindPopup(
          "現在地"
        )
        .openPopup();

    },

    () => {

      showToast(
        "現在地を取得できませんでした"
      );
    }
  );
}


async function showMemoryOnMap(
  id
) {

  const memory =
    await getMemory(id);


  if (!memory) {

    showToast(
      "データが見つかりません"
    );

    return;
  }


  if (
    !hasLocation(memory)
  ) {

    showToast(
      "この思い出には位置情報がありません"
    );

    return;
  }


  openScreen(
    "map"
  );


  setTimeout(
    () => {

      if (!map) {
        return;
      }


      map.setView(
        [
          Number(
            memory.latitude
          ),
          Number(
            memory.longitude
          )
        ],
        16
      );


      const marker =
        mapMarkers.find(
          marker => {

            const latLng =
              marker.getLatLng();


            return (
              Math.abs(
                latLng.lat -
                  Number(
                    memory.latitude
                  )
              ) < 0.000001 &&

              Math.abs(
                latLng.lng -
                  Number(
                    memory.longitude
                  )
              ) < 0.000001
            );
          }
        );


      if (marker) {
        marker.openPopup();
      }

    },
    300
  );
}

    );

/* =========================================================
   STORAGE STATUS
========================================================= */

async function renderStorageStatus() {

  const memories =
    await getAllMemories();


  let photoCount = 0;


  for (
    const memory
    of memories
  ) {

    const photos =
      await getPhotosForMemory(
        memory.id
      );

    photoCount +=
      photos.length;
  }


  const locationCount =
    memories.filter(
      memory =>
        hasLocation(
          memory
        )
    ).length;


  document.getElementById(
    "storageStatus"
  ).innerHTML = `

    思い出：${memories.length}件<br>

    写真：${photoCount}枚<br>

    位置情報あり：${locationCount}件

  `;
}
